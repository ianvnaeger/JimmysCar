<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#88c8e8" />
    <meta
      name="description"
      content="A tiny pixel-art parking space reserved for Jimmy."
    />
    <title>Reserved for Jimmy</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="pixel-frame" aria-labelledby="page-title">
        <h1 id="page-title" class="sr-only">Reserved for Jimmy</h1>

        <div class="scene" role="img" aria-label="An empty pixel-art parking space with a sign that says Reserved for Jimmy">
          <div class="sun" aria-hidden="true"></div>
          <div class="cloud cloud-one" aria-hidden="true"></div>
          <div class="cloud cloud-two" aria-hidden="true"></div>

          <div class="grass" aria-hidden="true">
            <span class="flower flower-one"></span>
            <span class="flower flower-two"></span>
            <span class="flower flower-three"></span>
          </div>

          <div class="parking-lot" aria-hidden="true">
            <div class="parking-space">
              <span class="space-line line-left"></span>
              <span class="space-line line-right"></span>
              <span class="space-line line-back"></span>
              <span class="space-number">J</span>
            </div>
            <span class="asphalt-speck speck-one"></span>
            <span class="asphalt-speck speck-two"></span>
            <span class="asphalt-speck speck-three"></span>
            <span class="asphalt-speck speck-four"></span>
          </div>

          <div class="sign" aria-hidden="true">
            <div class="sign-board">
              <span>RESERVED</span>
              <span>FOR</span>
              <strong>JIMMY</strong>
            </div>
            <div class="sign-post"></div>
            <div class="sign-base"></div>
          </div>
        </div>

        <p class="caption">Jimmy's spot is waiting.</p>
      </section>
    </main>
  </body>
</html>
